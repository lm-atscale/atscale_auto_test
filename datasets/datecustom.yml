    data_type: int
  - name: date_name
    data_type: string
  - name: year
    data_type: datetime
  - name: year_name
    data_type: string
  - name: quarter
    data_type: datetime
  - name: quarter_name
    data_type: string
  - name: month
    data_type: datetime
  - name: month_name
    data_type: string
