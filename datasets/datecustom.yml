unique_name: datecustom
object_type: dataset
label: datecustom
description: >-
  Date dimension table (AdventureWorks DateCustom) from
  SE_DEMO_LIBRARY.AS_ADVENTURE_SE_DEMO2. Simplified projection (Year/Quarter/
  Month/Day only) for DAX education testing — the full physical table has
  ~99 columns across three calendar systems, not needed here.
connection_id: Connection - Internet Sales
table: DATECUSTOM

columns:
