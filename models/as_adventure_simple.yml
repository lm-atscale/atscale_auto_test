unique_name: as_adventure_simple
object_type: model
label: AS Adventure Simple
description: >-
  DAX education test model (finished): factinternetsales fact (full column
  projection), Product dimension, role-played Date dimension (Order Date /
  Ship Date), degenerate Sales Order Number dimension, and a range of sum/
  average/distinct-count metrics — built to exercise the Server-Side DAX
  field guide's confirmed patterns and known constraints.
dimensions:
  - Sales Order Number
metrics:
  - unique_name: Total Sales
    folder: Sales Metrics
  - unique_name: Total Tax
    folder: Sales Metrics
  - unique_name: Total Quantity
    folder: Sales Metrics
  - unique_name: Average Unit Price
    folder: Sales Metrics
  - unique_name: Average Sales Amount
    folder: Sales Metrics
  - unique_name: Order Count
    folder: Sales Metrics
  - unique_name: Customer Count
    folder: Sales Metrics
  - unique_name: Product Count
    folder: Sales Metrics
  - unique_name: Monthly Product Sales
    folder: Sales Metrics
  - unique_name: DAX Test 01 - Avg Order Value
    folder: DAX Tests
  - unique_name: DAX Test 02 - IF Over Average Metric
    folder: DAX Tests
  - unique_name: DAX Test 03 - Switch Tiered Rounding
    folder: DAX Tests
  - unique_name: DAX Test 04 - Pct of Total ALL
    folder: DAX Tests
  - unique_name: DAX Test 05 - Pct of Total ALLSELECTED
    folder: DAX Tests
  - unique_name: DAX Test 06 - SUMX Iterator
    folder: DAX Tests
  - unique_name: DAX Test 07 - AVERAGEX Iterator
    folder: DAX Tests
  - unique_name: DAX Test 08 - COUNTROWS VALUES
    folder: DAX Tests
  - unique_name: DAX Test 09 - FILTER CALCULATE
    folder: DAX Tests
  - unique_name: DAX Test 11 - Unscoped ALL
    folder: DAX Tests
  - unique_name: DAX Test 12 - Unscoped ALLSELECTED
    folder: DAX Tests
  - unique_name: DAX Test 13 - ROUND Negative Scale
    folder: DAX Tests
  - unique_name: DAX Test 13b - ROUND Negative Scale -9
    folder: DAX Tests
  - unique_name: DAX Test 13c - ROUND Negative Scale -12
    folder: DAX Tests
  - unique_name: DAX Test 15 - DATESYTD
    folder: DAX Tests
  - unique_name: DAX Test 16 - VAR Row Context
    folder: DAX Tests
  - unique_name: DAX Test 17 - ROUND Scale -7
    folder: DAX Tests
  - unique_name: DAX Test 18 - ROUND Scale -8
    folder: DAX Tests
  - unique_name: DAX Test 20 - DATESQTD
    folder: DAX Tests
  - unique_name: DAX Test 21 - DATESMTD
    folder: DAX Tests
  - unique_name: DAX Test 23 - DISTINCTCOUNT
    folder: DAX Tests
relationships:
  - unique_name: factinternetsales_Product
    from:
      dataset: factinternetsales
      join_columns:
        - productkey
    to:
      dimension: Product
      level: Product Name
  - unique_name: factinternetsales_Date_Order
    from:
      dataset: factinternetsales
      join_columns:
        - orderdatekey
    to:
      dimension: Date
      level: Day
    role_play: "Order {0}"
  - unique_name: factinternetsales_Date_Ship
    from:
      dataset: factinternetsales
      join_columns:
        - shipdatekey
    to:
      dimension: Date
      level: Day
    role_play: "Ship {0}"
  - unique_name: monthly_product_sales_Product
    from:
      dataset: monthly_product_sales
      join_columns:
        - productkey
    to:
      dimension: Product
      level: Product Name
visible: true
