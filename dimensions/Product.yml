unique_name: Product
object_type: dimension
label: Product
description: >-
  Product dimension (AdventureWorks DimProduct), joined to factinternetsales
  via productkey. Added to exercise the CALCULATE+ALL(column) and
  ALLSELECTED(column) DAX patterns (% of total / slicer-aware % of total)
  from the Server-Side DAX field guide.
hierarchies:
  - unique_name: Product
    label: Product
    description: Product Line > Product Category > Product Name hierarchy.
    folder: Product Attributes
    levels:
      - unique_name: Product Line
      - unique_name: Product Category
      - unique_name: Product Name
level_attributes:
  - unique_name: Product Line
    label: Product Line
    description: Top-level product line (e.g. Road, Mountain, Touring).
    dataset: dimproduct
    key_columns:
      - productline
    name_column: productline
  - unique_name: Product Category
    label: Product Category
    description: Product subcategory name (e.g. Bike Racks, Helmets).
    dataset: dimproduct
    key_columns:
      - productsubcategorykey
    name_column: productsubcategoryname
  - unique_name: Product Name
    label: Product Name
    description: Full product name, lowest grain of the Product hierarchy.
    dataset: dimproduct
    key_columns:
      - productkey
    name_column: englishproductname
type: standard
